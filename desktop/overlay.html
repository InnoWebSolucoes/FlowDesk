<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; cursor: col-resize; }
</style>
</head>
<body>
<script>
  // This page is only visible while a divider drag is in progress. It exists so
  // mouse events keep flowing to the shell instead of the two content panes.
  const end = () => window.shellAPI.dragEnd()

  addEventListener('pointermove', (e) => {
    // A trackpad can deliver a move with no button held after the release was
    // missed; treat that as the end of the drag rather than staying stuck to
    // the cursor.
    if (e.buttons === 0) { end(); return }
    window.shellAPI.dragMove(e.clientX)
  })

  // pointerup and mouseup both, because a trackpad release does not always
  // produce the mouse event, which used to leave the divider held.
  addEventListener('pointerup', end)
  addEventListener('pointercancel', end)
  addEventListener('mouseup', end)
  addEventListener('mouseleave', end)
  addEventListener('blur', end)
  addEventListener('keydown', (e) => { if (e.key === 'Escape') end() })
</script>
</body>
</html>
