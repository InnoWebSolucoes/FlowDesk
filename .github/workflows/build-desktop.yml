# Builds the desktop app for macOS (and Windows) on GitHub's own machines.
#
# A .dmg can only be produced on macOS — hdiutil is macOS-only — so this exists
# to build the Mac version without owning a Mac. Run it from the Actions tab
# ("Run workflow"), then download the installers from the run's Artifacts.

name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: FlowDesk-macOS
            pattern: desktop/dist/*.dmg
          - os: windows-latest
            script: dist
            artifact: FlowDesk-Windows
            pattern: desktop/dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Generate the app icon
        working-directory: desktop
        run: npm run icon

      - name: Build
        working-directory: desktop
        # No Apple/Windows certificate: one is not worth it for an internal
        # tool. macOS builds are still ad-hoc signed (identity "-"), because an
        # entirely unsigned app is rejected on Apple Silicon as "damaged".
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }}

      - name: Check the macOS signature
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        # Fails the build rather than shipping a .dmg that cannot be opened.
        run: |
          APP=$(find dist -name 'FlowDesk.app' -maxdepth 3 | head -1)
          echo "checking $APP"
          codesign -dv "$APP" 2>&1 | head -5
          codesign --verify --deep --strict "$APP" && echo "signature OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
