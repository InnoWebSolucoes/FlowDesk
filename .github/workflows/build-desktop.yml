# Builds the desktop app for macOS (and Windows) on GitHub's own machines.
#
# A .dmg can only be produced on macOS — hdiutil is macOS-only — so this exists
# to build the Mac version without owning a Mac. Run it from the Actions tab
# ("Run workflow"), then download the installers from the run's Artifacts.

name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: FlowDesk-macOS
            pattern: desktop/dist/*.dmg
          - os: windows-latest
            script: dist
            artifact: FlowDesk-Windows
            pattern: desktop/dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Generate the app icon
        working-directory: desktop
        run: npm run icon

      - name: Build
        working-directory: desktop
        # No certificate for either platform: one is not worth it for an
        # internal tool. macOS is ad-hoc signed below, because an entirely
        # unsigned app is refused on Apple Silicon as "damaged".
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }}

      - name: Ad-hoc sign the macOS app and repackage
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        # electron-builder leaves the app unsigned, so sign each built .app and
        # rebuild the disk images from the signed copies — signing after the
        # .dmg exists would not reach the app inside it.
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")

          rm -f dist/*.dmg
          for APP in $(find dist -name 'FlowDesk.app' -maxdepth 3); do
            # Read the architecture from the binary itself. Directory names
            # are unreliable: electron-builder uses dist/mac for one arch and
            # dist/mac-<arch> for the other, and which one is which varies.
            BIN="$APP/Contents/MacOS/FlowDesk"
            if lipo -archs "$BIN" 2>/dev/null | grep -q arm64; then
              ARCH=arm64
            else
              ARCH=x64
            fi

            echo "signing $APP ($ARCH)"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            codesign -dv "$APP" 2>&1 | head -3

            OUT="dist/FlowDesk-$VERSION-$ARCH.dmg"
            if [ -f "$OUT" ]; then
              echo "already have $ARCH; skipping $APP"
              continue
            fi
            hdiutil create -volname FlowDesk -srcfolder "$APP" -ov -format UDZO "$OUT"
          done

          ls -la dist/*.dmg
          # Both architectures must exist, or Intel Macs get nothing.
          test -f "dist/FlowDesk-$VERSION-arm64.dmg"
          test -f "dist/FlowDesk-$VERSION-x64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
